<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>linux-notes — day1+day2</title>
<style>
  :root{
    --bg: #14120f;
    --bg2: #1b1815;
    --panel: #201c17;
    --line: #3a352c;
    --amber: #ffb454;
    --amber-dim: #a67c3d;
    --teal: #7fb8ac;
    --text: #e9e2d3;
    --muted: #948b78;
    --danger: #c9695a;
    --good: #7fae6e;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--mono);}
  body{
    min-height:100vh;
    display:flex; align-items:flex-start; justify-content:center;
    padding:24px 12px 60px;
  }
  #boot{
    position:fixed; inset:0; background:#0e0c0a; color:var(--amber);
    z-index:50; padding:6vh 6vw; font-size:14px; line-height:1.7;
    white-space:pre-wrap; cursor:pointer;
  }
  #boot .hint{position:absolute;bottom:24px;left:6vw;color:var(--muted);font-size:12px;}
  #boot .cursor{display:inline-block;width:8px;background:var(--amber);animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}

  .wrap{width:100%; max-width:980px;}
  .term{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
  }
  .titlebar{
    display:flex; align-items:center; gap:10px;
    padding:9px 14px; background:var(--bg2); border-bottom:1px solid var(--line);
  }
  .dot{width:10px;height:10px;border-radius:50%;background:#4a443a;}
  .titlebar .name{margin-left:6px;color:var(--muted);font-size:12.5px; letter-spacing:.03em;}

  .tabs{
    display:flex; flex-wrap:wrap; gap:2px; background:var(--bg2);
    border-bottom:1px solid var(--line); padding:6px 8px 0;
  }
  .tab{
    padding:7px 12px; font-size:12.5px; color:var(--muted); cursor:pointer;
    border:1px solid transparent; border-bottom:none; border-radius:5px 5px 0 0;
    background:transparent; user-select:none; white-space:nowrap;
  }
  .tab .n{color:var(--amber-dim); margin-right:6px;}
  .tab:hover{color:var(--text);}
  .tab.active{background:var(--bg); color:var(--amber); border-color:var(--line);}
  .tab.active .n{color:var(--amber);}

  .content{background:var(--bg); padding:26px 28px 34px; min-height:520px;}
  .pane{display:none; animation:fade .25s ease;}
  .pane.active{display:block;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  h1{font-size:15px; color:var(--amber); margin:0 0 4px; letter-spacing:.02em;}
  .path{color:var(--muted); font-size:12px; margin-bottom:20px;}
  .path .sep{color:var(--line);}
  h2{font-size:13px; color:var(--teal); text-transform:uppercase; letter-spacing:.08em; margin:26px 0 10px; border-bottom:1px dashed var(--line); padding-bottom:6px;}
  h2:first-of-type{margin-top:0;}
  p{font-size:13.5px; line-height:1.7; color:var(--text); margin:0 0 12px;}
  .muted{color:var(--muted);}
  .prompt{color:var(--good);}
  .prompt2{color:var(--teal);}
  code, .kbd{background:#0e0c0a; border:1px solid var(--line); border-radius:3px; padding:1px 6px; color:var(--amber); font-size:12.5px;}
  ul.plain{margin:0 0 14px; padding-left:20px; font-size:13.5px; line-height:1.75;}
  ul.plain li::marker{color:var(--amber-dim);}

  table{width:100%; border-collapse:collapse; font-size:12.5px; margin-bottom:18px;}
  th,td{border:1px solid var(--line); padding:7px 10px; text-align:left; vertical-align:top;}
  th{background:var(--bg2); color:var(--teal); font-weight:600; text-transform:uppercase; font-size:11px; letter-spacing:.04em;}
  td code{white-space:nowrap;}

  /* ---- Architecture stack ---- */
  .stack{display:flex; flex-direction:column; gap:6px; margin:18px 0;}
  .layer{
    border:1px solid var(--line); background:var(--bg2); border-radius:6px;
    padding:12px 14px; cursor:pointer; transition:.15s;
  }
  .layer:hover{border-color:var(--amber-dim);}
  .layer.open{border-color:var(--amber); background:#241f18;}
  .layer .lhead{display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--text);}
  .layer .lhead b{color:var(--amber);}
  .layer .lhead .arrow{color:var(--muted); transition:.15s;}
  .layer.open .arrow{transform:rotate(90deg); color:var(--amber);}
  .layer .detail{display:none; margin-top:10px; font-size:12.5px; color:var(--muted); line-height:1.7; border-top:1px dashed var(--line); padding-top:10px;}
  .layer.open .detail{display:block;}

  /* ---- lifecycle stepper ---- */
  .stepper{border:1px solid var(--line); background:var(--bg2); border-radius:6px; padding:16px; margin:16px 0;}
  .steps-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .step-dot{width:26px; height:26px; border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--muted);}
  .step-dot.done{background:var(--amber); color:#14120f; border-color:var(--amber); font-weight:700;}
  .step-line{flex:1; height:1px; background:var(--line); align-self:center; min-width:8px;}
  #stepText{font-size:13px; min-height:44px; color:var(--text);}
  #stepText .cmd{color:var(--good);}
  .btnrow{display:flex; gap:8px; margin-top:12px;}
  button{
    font-family:var(--mono); font-size:12px; background:var(--bg); color:var(--amber);
    border:1px solid var(--amber-dim); border-radius:5px; padding:7px 14px; cursor:pointer;
  }
  button:hover{background:#241f18;}
  button:disabled{opacity:.35; cursor:default;}
  button.ghost{color:var(--muted); border-color:var(--line);}

  /* ---- Roadmap ---- */
  .modgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px;}
  .modcard{border:1px solid var(--line); background:var(--bg2); border-radius:6px; padding:12px 14px;}
  .modcard .mtitle{font-size:13px; color:var(--amber); margin-bottom:4px;}
  .modcard .stars{color:var(--amber-dim); font-size:11px;}
  .modcard .meta{color:var(--muted); font-size:11.5px; margin-top:6px;}

  /* ---- Flashcards ---- */
  .fc-wrap{display:flex; flex-direction:column; align-items:center; gap:14px;}
  .fc-progress{width:100%; display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted);}
  .card{
    width:100%; max-width:560px; height:220px; perspective:1000px; cursor:pointer;
  }
  .card-inner{position:relative; width:100%; height:100%; transition:transform .45s; transform-style:preserve-3d;}
  .card.flipped .card-inner{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:8px;
    border:1px solid var(--line); background:var(--bg2); display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px;
  }
  .face.front .tag{position:absolute; top:12px; left:14px; font-size:10.5px; color:var(--amber-dim); letter-spacing:.06em;}
  .face.front p, .face.back p{font-size:14.5px; line-height:1.6; margin:0;}
  .face.back{transform:rotateY(180deg); border-color:var(--teal);}
  .face .hint{position:absolute; bottom:12px; font-size:10.5px; color:var(--muted);}
  .fc-controls{display:flex; gap:8px; align-items:center;}
  .fc-score{font-size:11.5px; color:var(--muted);}
  .fc-score b.g{color:var(--good);} .fc-score b.r{color:var(--danger);}

  /* ---- Quiz ---- */
  .qcount{font-size:11.5px; color:var(--muted); margin-bottom:10px;}
  .qtext{font-size:14px; margin-bottom:14px; color:var(--text);}
  .opts{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
  .opt{
    text-align:left; border:1px solid var(--line); background:var(--bg2); color:var(--text);
    padding:10px 12px; border-radius:5px; cursor:pointer; font-size:13px; font-family:var(--mono);
  }
  .opt:hover{border-color:var(--amber-dim);}
  .opt.correct{border-color:var(--good); background:#1c2417; color:var(--good);}
  .opt.wrong{border-color:var(--danger); background:#241715; color:var(--danger);}
  .opt.disabled{cursor:default;}
  #quizExplain{font-size:12.5px; color:var(--muted); border-left:2px solid var(--amber-dim); padding-left:10px; margin-bottom:14px; display:none;}
  #quizDone{display:none; text-align:center; padding:30px 0;}
  #quizDone .score{font-size:32px; color:var(--amber); margin-bottom:8px;}

  /* ---- FHS tree ---- */
  .tree{font-size:13px; line-height:1.9;}
  .tnode{cursor:pointer; padding:2px 4px; border-radius:3px;}
  .tnode:hover{background:#241f18;}
  .tnode .p{color:var(--amber);}
  .tnode .d{color:var(--muted); font-size:11.5px;}
  .tdetail{display:none; margin:4px 0 8px 20px; font-size:12px; color:var(--muted); border-left:2px solid var(--line); padding-left:10px;}
  .tdetail.open{display:block;}
  .indent1{padding-left:18px;} .indent2{padding-left:36px;}

  /* ---- Mind map ---- */
  .mm-wrap{display:flex; gap:18px; flex-wrap:wrap;}
  .mm-svg{flex:1; min-width:280px;}
  .mm-detail{flex:1; min-width:240px; border:1px solid var(--line); background:var(--bg2); border-radius:6px; padding:14px; font-size:12.5px; color:var(--muted); line-height:1.7; min-height:200px;}
  .mm-node circle{fill:var(--bg2); stroke:var(--line); stroke-width:1.5; cursor:pointer; transition:.15s;}
  .mm-node:hover circle, .mm-node.active circle{stroke:var(--amber); fill:#241f18;}
  .mm-node text{fill:var(--text); font-size:10.5px; font-family:var(--mono); pointer-events:none;}
  .mm-node.active text{fill:var(--amber);}
  .mm-link{stroke:var(--line); stroke-width:1;}

  /* ---- Recall ---- */
  .recall-card{border:1px solid var(--line); background:var(--bg2); border-radius:6px; padding:14px 16px; margin-bottom:10px; cursor:pointer;}
  .recall-q{font-size:13px; color:var(--text);}
  .recall-a{display:none; margin-top:10px; font-size:12.5px; color:var(--teal); border-top:1px dashed var(--line); padding-top:10px; line-height:1.6;}
  .recall-a.open{display:block;}
  .recall-mark{float:right; color:var(--amber-dim); font-size:11px;}

  .statusbar{
    display:flex; justify-content:space-between; padding:7px 14px; background:var(--bg2);
    border-top:1px solid var(--line); font-size:11px; color:var(--muted);
  }
  .statusbar span b{color:var(--amber-dim);}
  ::selection{background:var(--amber-dim); color:#14120f;}
  @media (max-width:640px){ .content{padding:18px 16px;} }
</style>
</head>
<body>

<div id="boot">root@day1-day2:~$ cat study_package.sh<span class="cursor"></span>
<div class="hint">click anywhere to continue &gt;</div>
</div>

<div class="wrap">
  <div class="term">
    <div class="titlebar">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <div class="name">gokul@linux-notes: ultimate-linux-guide — day1+day2</div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="content" id="content"></div>
    <div class="statusbar">
      <span><b>6</b> modules · <b>32</b> flashcards · <b>15</b> quiz Qs</span>
      <span>source: iam-veeramalla/ultimate-linux-guide</span>
    </div>
  </div>
</div>

<script>
/* ---------------- BOOT SEQUENCE ---------------- */
const bootLines = [
"[  OK  ] Mounted /01-getting-started",
"[  OK  ] Mounted /02-folder-structure",
"[  OK  ] Loaded 05 concept modules",
"[  OK  ] Indexed 32 flashcards, 15 quiz items",
"[  OK  ] Rendered architecture + FHS mental models",
"Started linux-study-app.target",
"",
"welcome back. day 1 + day 2 loaded."
];
const bootEl = document.getElementById('boot');
let bi = 0;
function typeBoot(){
  if(bi >= bootLines.length){ return; }
  const line = document.createElement('div');
  bootEl.insertBefore(line, bootEl.querySelector('.hint'));
  let ci = 0;
  const t = setInterval(()=>{
    line.textContent = bootLines[bi].slice(0, ci+1);
    ci++;
    if(ci >= bootLines[bi].length){ clearInterval(t); bi++; setTimeout(typeBoot, 90); }
  }, 12);
}
typeBoot();
bootEl.addEventListener('click', ()=>{ bootEl.style.transition='opacity .3s'; bootEl.style.opacity=0; setTimeout(()=>bootEl.remove(),300); });
setTimeout(()=>{ if(document.getElementById('boot')){ bootEl.style.transition='opacity .3s'; bootEl.style.opacity=0; setTimeout(()=>bootEl.remove(),300);} }, 4500);

/* ---------------- TABS ---------------- */
const tabsData = [
  {id:'big', n:'1', label:'big-picture'},
  {id:'arch', n:'2', label:'architecture'},
  {id:'road', n:'3', label:'roadmap'},
  {id:'fhs', n:'4', label:'fhs-tree'},
  {id:'cheat', n:'5', label:'cheatsheet'},
  {id:'cards', n:'6', label:'flashcards'},
  {id:'quiz', n:'7', label:'quiz'},
  {id:'mind', n:'8', label:'mindmap'},
  {id:'recall', n:'9', label:'recall'},
];
const tabsEl = document.getElementById('tabs');
tabsData.forEach(t=>{
  const d = document.createElement('div');
  d.className='tab'; d.dataset.id=t.id;
  d.innerHTML = `<span class="n">${t.n}</span>${t.label}`;
  d.onclick=()=>activate(t.id);
  tabsEl.appendChild(d);
});
function activate(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.id===id));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active', p.id==='pane-'+id));
}

/* ---------------- CONTENT ---------------- */
const content = document.getElementById('content');
content.innerHTML = `
<div class="pane active" id="pane-big">
  <h1>$ cat 01-getting-started/README</h1>
  <div class="path">~/ultimate-linux-guide <span class="sep">›</span> 01-getting-started</div>
  <h2>what is this</h2>
  <p>A revision-notes repo for a Linux course — takes you from "what even is Linux" to file systems, package managers and (later) users/processes/networking. It's dense course content compressed into notes you can re-scan in minutes.</p>
  <h2>why it exists</h2>
  <p>Linux runs almost everything you'll touch as a backend/DevOps engineer: cloud VMs, Docker hosts, CI runners, Kubernetes nodes. This is the layer underneath your own <span class="prompt2">Petronet CDP</span> VMs and the Mumbai↔Chennai backup boxes.</p>
  <h2>who this is for</h2>
  <ul class="plain">
    <li>Backend / DevOps engineers who need Linux fluency, not just familiarity</li>
    <li>Anyone prepping for infra interviews where "explain what happens when you type a command" is a real question</li>
    <li>You, revising before you forget — that's the whole point of this app</li>
  </ul>
  <h2>day 1 + day 2 scope</h2>
  <p><span class="prompt">01</span> fundamentals (Linux vs Windows) · <span class="prompt">02</span> system architecture · <span class="prompt">03</span> distributions · <span class="prompt">04</span> environment setup · <span class="prompt">05</span> package managers · <span class="prompt">06</span> folder structure (FHS)</p>
</div>

<div class="pane" id="pane-arch">
  <h1>$ ./render --diagram architecture</h1>
  <div class="path">mental model <span class="sep">›</span> click a layer</div>
  <h2>the layered stack</h2>
  <div class="stack" id="stackLayers"></div>

  <h2>command lifecycle — <code>ls -l</code></h2>
  <p class="muted">Step through what actually happens between you pressing Enter and text appearing.</p>
  <div class="stepper">
    <div class="steps-row" id="stepDots"></div>
    <div id="stepText"></div>
    <div class="btnrow">
      <button id="stepBack" class="ghost" disabled>&larr; back</button>
      <button id="stepNext">next step &rarr;</button>
      <button id="stepReset" class="ghost">reset</button>
    </div>
  </div>
</div>

<div class="pane" id="pane-road">
  <h1>$ ls -la modules/</h1>
  <div class="path">6 modules <span class="sep">›</span> day 1 + day 2</div>
  <div class="modgrid" id="modGrid"></div>
</div>

<div class="pane" id="pane-fhs">
  <h1>$ tree / -L 2</h1>
  <div class="path">Filesystem Hierarchy Standard <span class="sep">›</span> click any directory</div>
  <div class="tree" id="fhsTree"></div>
</div>

<div class="pane" id="pane-cheat">
  <h1>$ man cheatsheet</h1>
  <div class="path">one page <span class="sep">›</span> everything you'll actually type</div>
  <h2>package managers</h2>
  <table>
    <tr><th>family</th><th>update</th><th>install</th><th>upgrade</th><th>remove</th><th>search</th></tr>
    <tr><td>Debian/Ubuntu</td><td><code>apt update</code></td><td><code>apt install pkg</code></td><td><code>apt upgrade</code></td><td><code>apt remove pkg</code></td><td><code>apt search x</code></td></tr>
    <tr><td>Fedora/RHEL</td><td><code>dnf check-update</code></td><td><code>dnf install pkg</code></td><td><code>dnf update</code></td><td><code>dnf remove pkg</code></td><td><code>dnf search x</code></td></tr>
    <tr><td>Arch</td><td><code>pacman -Sy</code></td><td><code>pacman -S pkg</code></td><td><code>pacman -Su</code></td><td><code>pacman -R pkg</code></td><td><code>pacman -Ss x</code></td></tr>
    <tr><td>SUSE</td><td><code>zypper refresh</code></td><td><code>zypper install pkg</code></td><td><code>zypper update</code></td><td><code>zypper remove pkg</code></td><td><code>zypper search x</code></td></tr>
  </table>
  <h2>repo config locations</h2>
  <ul class="plain">
    <li>APT <span class="muted">→</span> <code>/etc/apt/sources.list</code></li>
    <li>DNF <span class="muted">→</span> <code>/etc/yum.repos.d/</code></li>
    <li>Pacman <span class="muted">→</span> <code>/etc/pacman.conf</code></li>
    <li>Zypper <span class="muted">→</span> <code>/etc/zypp/repos.d/</code></li>
  </ul>
  <h2>persistent dev container</h2>
  <table>
    <tr><td><code>-dit</code></td><td>detached + interactive + tty</td></tr>
    <tr><td><code>--restart unless-stopped</code></td><td>survives host reboot</td></tr>
    <tr><td><code>--mount type=bind,source=...,target=/data</code></td><td>persistent storage</td></tr>
    <tr><td><code>-p 2222:22</code></td><td>SSH port mapping</td></tr>
    <tr><td><code>--env TZ=Asia/Kolkata</code></td><td>timezone</td></tr>
  </table>
  <h2>fixing things</h2>
  <ul class="plain">
    <li>Apt locked / interrupted <span class="muted">→</span> <code>dpkg --configure -a</code></li>
    <li>Broken dependencies <span class="muted">→</span> <code>apt --fix-broken install</code></li>
    <li>Stale package index <span class="muted">→</span> always <code>apt update</code> before <code>install</code></li>
  </ul>
</div>

<div class="pane" id="pane-cards">
  <h1>$ ./flashcards --shuffle</h1>
  <div class="path">click card to flip <span class="sep">›</span> rate yourself to move on</div>
  <div class="fc-wrap">
    <div class="fc-progress"><span id="fcPos">1 / 32</span><span class="fc-score">know: <b class="g" id="fcKnow">0</b> &nbsp;shaky: <b class="r" id="fcUnsure">0</b></span></div>
    <div class="card" id="fcCard">
      <div class="card-inner">
        <div class="face front"><span class="tag">Q</span><p id="fcQ"></p><span class="hint">click to reveal answer</span></div>
        <div class="face back"><p id="fcA"></p><span class="hint">click to flip back</span></div>
      </div>
    </div>
    <div class="fc-controls">
      <button class="ghost" id="fcPrev">&larr; prev</button>
      <button id="fcUnsureBtn">shaky 🤔</button>
      <button id="fcKnowBtn">know it ✓</button>
      <button class="ghost" id="fcShuffle">shuffle</button>
    </div>
  </div>
</div>

<div class="pane" id="pane-quiz">
  <h1>$ ./quiz --mode interview-prep</h1>
  <div class="path">15 questions <span class="sep">›</span> easy to interview-level</div>
  <div id="quizArea">
    <div class="qcount" id="qCount"></div>
    <div class="qtext" id="qText"></div>
    <div class="opts" id="qOpts"></div>
    <div id="quizExplain"></div>
    <button id="qNext" style="display:none;">next question &rarr;</button>
  </div>
  <div id="quizDone">
    <div class="score" id="qScore"></div>
    <p class="muted" id="qScoreMsg"></p>
    <button id="qRestart">restart quiz</button>
  </div>
</div>

<div class="pane" id="pane-mind">
  <h1>$ ./mindmap --render</h1>
  <div class="path">click a node <span class="sep">›</span> connections light up on the right</div>
  <div class="mm-wrap">
    <svg class="mm-svg" viewBox="0 0 360 360" id="mmSvg"></svg>
    <div class="mm-detail" id="mmDetail">Click any node to see how it connects to the rest of your Linux mental model.</div>
  </div>
</div>

<div class="pane" id="pane-recall">
  <h1>$ ./active-recall --no-answers</h1>
  <div class="path">click each card <span class="sep">›</span> answer in your head first, then reveal</div>
  <div id="recallList"></div>
</div>
`;

/* ---------------- ARCHITECTURE LAYERS ---------------- */
const layers = [
  {t:'User Applications', d:'nginx, docker, browsers, your CDP FastAPI app — the top of the stack. Talk to the OS almost entirely through system libraries, not the kernel directly.'},
  {t:'Shell (bash/zsh/fish)', d:'The command interpreter between you and the kernel. Parses commands, handles history/aliases/scripting, and hands work off via system calls.'},
  {t:'System Utilities', d:'ls, grep, systemctl, ps — small composable tools installed as part of the base OS, used directly or scripted.'},
  {t:'System Libraries', d:'glibc, OpenSSL, GTK/Qt — expose clean APIs so apps do not need to make raw syscalls themselves.'},

/* ---------------- LIFECYCLE STEPPER ---------------- */
const steps = [
  'You type <span class="cmd">ls -l</span> and hit Enter.',
  'The <b>shell</b> parses the input and resolves the binary path: <span class="cmd">/bin/ls</span>.',
  'The shell calls <span class="cmd">fork()</span> — the kernel creates a new child process.',
  'The child process calls <span class="cmd">exec()</span>, replacing itself with the <code>ls</code> program.',
  '<code>ls</code> makes syscalls through <b>glibc</b> to read directory metadata.',
  'The <b>kernel</b> accesses the storage <b>hardware</b> and returns the raw data.',
  'Results bubble back up through the libraries to <code>ls</code>, which formats them.',
  'The shell regains control and prints a fresh prompt.'
];
let stepIdx = 0;
const stepDots = document.getElementById('stepDots');
const stepText = document.getElementById('stepText');
function renderSteps(){
  stepDots.innerHTML='';
  steps.forEach((s,i)=>{
    const dot = document.createElement('div');
    dot.className='step-dot'+(i<=stepIdx?' done':'');
    dot.textContent = i+1;
    stepDots.appendChild(dot);
    if(i < steps.length-1){
      const line = document.createElement('div');
      line.className='step-line';
      stepDots.appendChild(line);
    }
  });
  stepText.innerHTML = steps[stepIdx];
  document.getElementById('stepBack').disabled = stepIdx===0;
  document.getElementById('stepNext').textContent = stepIdx===steps.length-1 ? 'done ✓' : 'next step →';
  document.getElementById('stepNext').disabled = false;
}
document.getElementById('stepNext').onclick=()=>{ if(stepIdx<steps.length-1){ stepIdx++; renderSteps(); } };
document.getElementById('stepBack').onclick=()=>{ if(stepIdx>0){ stepIdx--; renderSteps(); } };
document.getElementById('stepReset').onclick=()=>{ stepIdx=0; renderSteps(); };
renderSteps();

let qIdx=0, qScore=0;
const qCount=document.getElementById('qCount'), qText=document.getElementById('qText'), qOpts=document.getElementById('qOpts'), qExplain=document.getElementById('quizExplain'), qNext=document.getElementById('qNext');
function renderQuiz(){
  document.getElementById('quizArea').style.display='block';
  document.getElementById('quizDone').style.display='none';
  const item = quiz[qIdx];
  qCount.textContent = 'question '+(qIdx+1)+' / '+quiz.length+'  ·  score: '+qScore;
  qText.textContent = item.q;
  qExplain.style.display='none'; qExplain.textContent='';
  qNext.style.display='none';
  qOpts.innerHTML='';
  item.o.forEach((opt,i)=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=opt;
    b.onclick=()=>{
      document.querySelectorAll('.opt').forEach(o=>o.classList.add('disabled'));
      if(i===item.c){ b.classList.add('correct'); qScore++; }
      else { b.classList.add('wrong'); qOpts.children[item.c].classList.add('correct'); }
      qExplain.textContent = item.e; qExplain.style.display='block';
      qNext.style.display='inline-block';
      qNext.textContent = qIdx===quiz.length-1 ? 'see results →' : 'next question →';
    };
    qOpts.appendChild(b);
  });
}
qNext.onclick=()=>{
  qIdx++;
  if(qIdx>=quiz.length){ finishQuiz(); } else { renderQuiz(); }
};
function finishQuiz(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('quizDone').style.display='block';
  document.getElementById('qScore').textContent = qScore+' / '+quiz.length;
  let msg='';
  const pct = qScore/quiz.length;
  if(pct===1) msg="Perfect run. Ready for the interview-level questions.";
  else if(pct>=0.7) msg="Solid — revisit the ones you missed, they'll come back as flashcards.";
  else msg="Worth another pass through architecture + cheatsheet before retrying.";
  document.getElementById('qScoreMsg').textContent = msg;
}
